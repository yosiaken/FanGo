<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e8a5f" />
    <meta name="description" content="分好帳 FanGo — 多家庭出遊分帳，算清楚誰該轉給誰" />
    <title>分好帳 FanGo</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><img src="icon.svg" alt="" width="28" height="28" /><span>分好帳</span><small>FanGo</small></div>
      <select id="activity-select" aria-label="切換活動"></select>
      <button class="icon-btn" id="menu-btn" aria-label="選單" aria-haspopup="true">⋯</button>
      <div class="menu" id="menu" hidden>
        <button data-action="new-activity">＋ 新增活動</button>
        <button data-action="load-sample">載入範例資料</button>
        <button data-action="share-link">產生分享連結</button>
        <button data-action="export">匯出備份（JSON）</button>
        <button data-action="import">匯入備份</button>
        <hr />
        <button data-action="delete-activity" class="danger">刪除此活動</button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="setup">① 家庭設定</button>
      <button role="tab" data-tab="expenses">② 費用紀錄</button>
      <button role="tab" data-tab="result">③ 結算</button>
    </nav>

    <main id="view"></main>

    <dialog id="expense-dialog"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="import-file" accept="application/json,.json" hidden />
    <noscript><p style="padding:16px">請開啟 JavaScript 才能使用分好帳。</p></noscript>
  </body>
</html>
